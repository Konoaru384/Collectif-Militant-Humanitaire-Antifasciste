<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMHA - Boutique & Don</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.ko-fi.tools/v2/js/shop.js"></script>
    <script defer src="https://cdn.ko-fi.tools/v2/js/commissions.js"></script>
</head>
<body>

<header id="site-header"></header>

<div class="container" style="display: block;">
    <h1 style="text-align: center;">Boutique</h1>
    <p style="text-align: center; color: #5f6368; max-width: 700px; margin: 0 auto 20px auto;">
Notre boutique, l'argent récoltée finance le collectif.    </p>

    <p style="text-align: center; margin-bottom: 30px;">
        <a href="https://ko-fi.com/cmha31/shop" target="_blank" rel="noopener" class="btn-order">Voir toute la boutique sur Ko-fi</a>
    </p>

<script src="data/articles.js"></script>
<script src="js/site.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const tabs = document.querySelectorAll("#shop-tabs .shop-tab");
    const panels = document.querySelectorAll(".shop-panel");
    tabs.forEach(tab => {
        tab.addEventListener("click", () => {
            tabs.forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            const target = tab.getAttribute("data-panel");
            panels.forEach(p => {
                p.style.display = p.id === target ? "block" : "none";
            });
        });
    });
});


(function () {
    const embed = document.getElementById("kofi-shop-embed");
    const catTabs = document.querySelectorAll("#shop-category-tabs .shop-tab");
    if (!embed || !catTabs.length) return;

    function normalize(str) {
        return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function detectCategory(text) {
        const t = normalize(text);
        const hasAffiche = t.includes("poster");
        const hasSticker = t.includes("sticker");
        const hasPerso = t.includes("personnalis") || t.includes("commission") || t.includes("sur mesure");
        if (hasPerso) return "personnalise";
        if (hasAffiche && hasSticker) return "posters";
        if (hasAffiche) return "posters";
        if (hasSticker) return "stickers";
        return "autre";
    }


    function findCard(img) {
        let el = img;
        for (let i = 0; i < 6 && el && el.parentElement; i++) {
            const parent = el.parentElement;
            const siblings = Array.from(parent.children).filter(c => c.tagName === el.tagName);
            if (siblings.length > 1) return el;
            el = parent;
        }
        return img.parentElement || img;
    }

    function tagCards() {
        const imgs = embed.querySelectorAll("img");
        if (!imgs.length) return false;
        imgs.forEach(img => {
            const card = findCard(img);
            if (!card || card.dataset.cmhaCategory) return;
            const text = card.textContent || img.getAttribute("alt") || "";
            card.dataset.cmhaCategory = detectCategory(text);
        });
        return true;
    }

    function applyFilter(category) {
        const cards = embed.querySelectorAll("[data-cmha-category]");
        cards.forEach(card => {
            card.style.display = (category === "all" || card.dataset.cmhaCategory === category) ? "" : "none";
        });
    }

    let currentCategory = "all";
    catTabs.forEach(tab => {
        tab.addEventListener("click", () => {
            catTabs.forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            currentCategory = tab.getAttribute("data-category");
            applyFilter(currentCategory);
        });
    });

    const observer = new MutationObserver(() => {
        tagCards();
        applyFilter(currentCategory);
    });
    observer.observe(embed, { childList: true, subtree: true });
    tagCards();
    applyFilter(currentCategory);
})();
</script>
</body>
</html>
